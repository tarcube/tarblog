collections:
  authors:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

url: "https://tarcube.github.io" # Your GitHub Pages root URL
baseurl: "/tarblog"       # Your exact repository name (must start with a slash)
